services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: sheen
      POSTGRES_PASSWORD: sheen
      POSTGRES_DB: sheen
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sheen -d sheen"]
      interval: 2s
      timeout: 3s
      retries: 30

  # GDAL, for loading the mangrove and settlement data (see scripts/).
  gdal:
    image: ghcr.io/osgeo/gdal:ubuntu-small-3.10.0
    profiles: ["tools"]
    working_dir: /work
    volumes: ["./scripts:/work/scripts:ro", "./data:/work/data"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
